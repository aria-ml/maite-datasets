variables:
  PYTHON_LATEST_SUPPORTED_VERSION: '3.13'
  SAST_EXCLUDED_PATHS: spec,test,tests,tmp,.nox,output
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: symlink
  UV_IMAGE: ghcr.io/astral-sh/uv
  UV_BASE_LAYER: bookworm
  FORCE_COLOR: '1'

workflow:
  # Allows jobs in this workflow to be interrupted:
  # https://gitlab.jatic.net/help/ci/yaml/index.md#workflowauto_cancelon_new_commit
  auto_cancel:
    on_new_commit: interruptible

default:
  # This should allow pipelines to auto-cancel when redundant:
  # https://gitlab.jatic.net/help/ci/pipelines/settings.md#auto-cancel-redundant-pipelines
  # https://gitlab.jatic.net/help/ci/yaml/index.md#interruptible
  interruptible: true
  tags:
    - autoscaler

image: $UV_IMAGE:python$PYTHON_LATEST_SUPPORTED_VERSION-$UV_BASE_LAYER

stages:
  - test
  - publish
  - security

### RULE TEMPLATES ###
#
# Named templates rather than bare anchors, matching the vocabulary the shared
# ci-components rules will use: $CI_DEFAULT_BRANCH instead of a literal 'main', and a
# release-trigger opt-out that becomes a component input.
#
# The anchors alongside them exist because the GitLab security templates use `extends:`
# internally -- overriding that breaks the analyzer inheritance chain -- so those jobs
# take their rules by anchor instead.

.rules_main_mr:
  rules: &rules_main_mr
    - if: $CREATE_NEW_RELEASE
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

# Security scan timing is policy, not a per-repo choice: scans run on merge requests and
# on protected refs. The group-level security policy for jatic/aria also scans default
# and protected branches into the same Vulnerability Report, so there is deliberate
# overlap -- the in-pipeline run is what gives per-commit feedback on the branch itself.
#
# Note CI_COMMIT_REF_PROTECTED is also true on the default branch when it is protected.
# Any other pipeline simply fails to match, so no `when: never` clauses are needed.
.rules_security:
  rules: &rules_security
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_REF_PROTECTED == "true"

### TEMPLATES ###

.nox:
  needs: []
  image: $UV_IMAGE:python$PYTHON_VERSION-$UV_BASE_LAYER
  cache:
    # uv cache, invalidated by the lockfile.
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
    # Downloaded datasets, keyed separately from the uv cache. Sharing the uv.lock key
    # meant a lockfile bump wiped every dataset, while a change to which datasets are
    # needed never invalidated them.
    - key: datasets
      paths:
        - data
  after_script:
    - uv cache prune --ci
  variables:
    PYTHON_VERSION: $PYTHON_LATEST_SUPPORTED_VERSION

.nox_all:
  extends: .nox
  image: $UV_IMAGE:python$PYTHON_VERSION-$UV_BASE_LAYER
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]

### TEST ###

lint:
  extends: [.nox, .rules_main_mr]
  script:
    - uvx --with nox-uv nox -s lint

typecheck:
  extends: [.nox_all, .rules_main_mr]
  script:
    # -P pins the interpreter to the matrix leg. The old `uv pip install nox --system`
    # guaranteed the image's python; uvx resolves its own, so without -P every leg could
    # typecheck the same version and the matrix would stop meaning anything.
    - uvx --with nox-uv nox -P $PYTHON_VERSION -s type

test:
  extends: [.nox_all, .rules_main_mr]
  script:
    # -P pins the interpreter so nox names the session `test-<version>`; the noxfile reads
    # that name to suffix its artifacts. Without it the suffix falls back to whichever
    # interpreter uvx happened to run nox under.
    - uvx --with nox-uv nox -P $PYTHON_VERSION -s test
  artifacts:
    # always: a failed run still publishes the JUnit report showing which test failed.
    when: always
    # Directory form, NOT `output/*` -- a glob drops the dotted coverage data files
    # (output/.coverage.3.11) that the `coverage` job needs to combine.
    paths:
      - output/
    reports:
      junit: output/junit.*.xml

### PUBLISH ###

coverage:
  extends: .rules_main_mr
  stage: publish
  needs: [test]
  before_script:
    - uv pip install coverage --system
  script:
    - coverage combine ./output
    # Reports BEFORE the gate. Every coverage subcommand honours [tool.coverage.report]
    # fail_under and exits 2 when it is not met, so gating first would skip report
    # generation exactly when the report matters most. --fail-under=0 keeps these steps
    # about writing files.
    - coverage xml --skip-empty --fail-under=0 -o coverage.xml
    - coverage html --skip-empty --fail-under=0 -d htmlcov
    # The gate, on the union of all matrix runs.
    - coverage report -m --skip-empty --precision=2
  coverage: '/(?i)total.*? (100(?:\.0+)?%|[1-9]?\d(?:\.\d+)?%)$/'
  artifacts:
    # always: a failed gate still publishes the report showing what is uncovered.
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/

### SECURITY ###

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml

# NOTE: Security template jobs use `extends:` internally -- do not override with
# `extends:` here or the template's analyzer inheritance chain breaks. Rules go in by
# anchor instead.

secret_detection:
  stage: security
  needs: []
  rules: *rules_security

gemnasium-python-dependency_scanning:
  stage: security
  needs: []
  rules: *rules_security

semgrep-sast:
  stage: security
  needs: []
  rules: *rules_security
